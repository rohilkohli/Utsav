# Runtime Environment Variables for Cloud Run Deployment (--env-vars-file)
# Instructions:
# 1. Copy this file to env.yaml: cp env.example.yaml env.yaml
# 2. Fill in your Firebase Web App configuration (Firebase Console -> Project Settings -> General -> Your apps -> Web app)
# 3. Deploy with: gcloud run deploy utsav --env-vars-file env.yaml ...
# 4. NOTE: env.yaml is strictly gitignored and must NEVER be committed to version control.

GEMINI_MODEL: "gemini-3.5-flash"
# Optional — enables real vendor search via Google Places API (New)
# GOOGLE_MAPS_API_KEY: "AIzaSy..."
NODE_ENV: "production"
FIREBASE_API_KEY: "AIzaSyYourApiKeyHere"
FIREBASE_AUTH_DOMAIN: "your-project-id.firebaseapp.com"
FIREBASE_PROJECT_ID: "your-project-id"
FIREBASE_STORAGE_BUCKET: "your-project-id.firebasestorage.app"
FIREBASE_MESSAGING_SENDER_ID: "123456789012"
FIREBASE_APP_ID: "1:123456789012:web:abcdef123456789"
