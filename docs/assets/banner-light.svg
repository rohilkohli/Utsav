<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
<title id="title">Utsav — Plan the joy. Keep every rupee in focus.</title>
<desc id="description">An India-first celebration planner for weddings, birthdays, and community festivals. A marigold-inspired emblem sits beside a sample budget and ceremony timeline.</desc>
