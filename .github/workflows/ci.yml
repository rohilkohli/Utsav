name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Typecheck → Lint → Test → Build → Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint (zero warnings allowed)
        run: npm run lint

      - name: Run tests
        run: npm test
        timeout-minutes: 20
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build client for E2E
        run: npm run build:client

      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: true

      # @grpc/grpc-js HIGH via firebase transitive dep — pinned in overrides.
      # Remaining moderate findings (vitest@2 mocker) are dev-only and not critical.
      - name: Security audit (critical only)
        run: npm audit --audit-level=critical
